name: Deploy para Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar pasta de deploy
        run: |
          command -v php >/dev/null && php -l nova-landing/index.php && php -l nova-landing/private/ofertas.php || echo "php ausente no runner, lint pulado"
          rm -rf deploy && mkdir -p deploy/imagens deploy/prova deploy/private
          cp nova-landing/index.html nova-landing/index.php nova-landing/privacidade.html nova-landing/termos.html deploy/
          # indexnovo/indexdesign NÃO publicam: são variantes locais de experimento
          # (testes Playwright usam o preview local). Não subir = a Action apaga
          # as cópias antigas do servidor no próximo deploy incremental.
          cp nova-landing/.htaccess deploy/ 2>/dev/null || true
          cp nova-landing/private/ofertas.php deploy/private/
          cp nova-landing/private/.htaccess deploy/private/
          cp conteudo/imagens/*.png conteudo/imagens/*.jpeg conteudo/imagens/*.jpg conteudo/imagens/*.svg deploy/imagens/
          cp conteudo/prova/*.jpg deploy/prova/
          sed -i 's#\.\./conteudo/imagens/#imagens/#g; s#\.\./conteudo/prova/#prova/#g' deploy/*.html deploy/*.php
          grep -r "conteudo/" deploy/ && exit 1 || echo "links ok"
          # garantia: index.php publicado não contém checkout hardcoded (só via ofertas.php)
          ! grep -o 'pay\.kiwify\.com\.br/[A-Za-z0-9]*' deploy/index.php && echo "php sem checkout hardcoded ok"

      - name: Enviar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./deploy/
