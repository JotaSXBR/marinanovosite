name: Deploy para cPanel (maricoachfit.com)

on:
  push:
    branches: [main]
  # Disparo manual: Actions → "Deploy para cPanel" → Run workflow.
  # Útil para republicar sem precisar inventar um commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar pasta de deploy
        run: |
          # Lint de TODOS os .php. Precisa distinguir "php ausente" de "php
          # invalido": `... | xargs php -l || echo "php ausente"` mascarava a
          # FALHA do php -l e o deploy seguia publicando arquivo quebrado
          # (aconteceu com painel/partes/). Agora: sem php -> aviso e segue;
          # com php e erro -> PARA o deploy.
          if command -v php >/dev/null; then
            find nova-landing -name '*.php' -not -path '*/dados/*' -print0 | xargs -0 -n1 php -l
            if [ ${PIPESTATUS[1]} -ne 0 ]; then
              echo "ERRO: sintaxe PHP invalida acima — deploy abortado"
              exit 1
            fi
            echo "php: sintaxe OK em todos os arquivos"
          else
            echo "AVISO: php ausente no runner, lint pulado"
          fi
          rm -rf deploy && mkdir -p deploy/imagens deploy/prova deploy/private/dados deploy/painel/partes
          cp nova-landing/index.html nova-landing/index.php nova-landing/privacidade.html nova-landing/termos.html deploy/
          # indexnovo/indexdesign NÃO publicam: são variantes locais de experimento
          # (testes Playwright usam o preview local). Não subir = a Action apaga
          # as cópias antigas do servidor no próximo deploy incremental.
          cp nova-landing/.htaccess deploy/ 2>/dev/null || true
          cp nova-landing/private/ofertas.php nova-landing/private/rastreio.php nova-landing/private/carrinhos.php deploy/private/
          cp nova-landing/private/.htaccess deploy/private/
          # painel da proprietária (o config.php já sobe com o hash da senha)
          cp nova-landing/painel/index.php nova-landing/painel/config.php nova-landing/painel/apoio.php deploy/painel/
          cp nova-landing/painel/.htaccess deploy/painel/
          cp nova-landing/painel/partes/*.php nova-landing/painel/partes/.htaccess deploy/painel/partes/
          # dados/ (log de visitas + links) só precisa existir com o .htaccess
          # que bloqueia o acesso — os arquivos são criados pelo painel em uso.
          cp nova-landing/private/dados/.htaccess deploy/private/dados/
          cp conteudo/imagens/*.png conteudo/imagens/*.jpeg conteudo/imagens/*.jpg conteudo/imagens/*.svg deploy/imagens/
          cp conteudo/prova/*.jpg deploy/prova/
          sed -i 's#\.\./conteudo/imagens/#imagens/#g; s#\.\./conteudo/prova/#prova/#g' deploy/*.html deploy/*.php deploy/painel/*.php

          # Guardas em `if` (e não `grep && {...}`): o shell do Actions roda com
          # `set -e`, e um `&&` que NÃO casa devolve status 1 — o que matava a
          # etapa mesmo com a guarda tendo passado.
          if grep -r -q "conteudo/" deploy/; then
            echo "ERRO: sobrou caminho de desenvolvimento (conteudo/)"; exit 1
          fi
          if grep -o -q 'pay\.kiwify\.com\.br/[A-Za-z0-9]*' deploy/index.php; then
            echo "ERRO: index.php publicado tem checkout hardcoded"; exit 1
          fi
          if ! grep -q "senha_hash" deploy/painel/config.php; then
            echo "ERRO: painel sem hash de senha"; exit 1
          fi
          if grep -q "COLE_AQUI_O_HASH" deploy/painel/config.php; then
            echo "ERRO: painel ainda com hash placeholder"; exit 1
          fi
          # carrinhos.php tem que existir: sem ele o painel cai em erro fatal
          [ -f deploy/private/carrinhos.php ] || { echo "ERRO: carrinhos.php ausente no deploy"; exit 1; }
          echo "links ok | php sem checkout hardcoded ok | painel com hash real | carrinhos ok"

      # DESTINO DO DEPLOY: vem da variable CPANEL_SERVER_DIR, que precisa estar na
      # aba *Variables* do GitHub — em *Secrets* ela é ignorada em silêncio e
      # o deploy cai na raiz sem avisar (já aconteceu). O passo "Mostrar
      # destino" abaixo imprime a resolução para ficar visível no log.
      #
      # Valor SEM barra inicial e RELATIVO à pasta da conta FTP (= public_html):
      #   "nova/" = maricoachfit.com/nova/   |   "" = raiz
      # (nunca "public_html/nova/" nem "/nova/" — barra inicial é inconsistente)
      - name: Mostrar destino do deploy
        env:
          DESTINO: ${{ vars.CPANEL_SERVER_DIR }}
        run: |
          if [ -z "$DESTINO" ]; then
            echo "⚠️  CPANEL_SERVER_DIR vazia (ou criada em Secrets) -> deploy na RAIZ (public_html)"
          else
            echo "📁 Deploy na subpasta: '$DESTINO' (relativo a public_html)"
          fi

      - name: Enviar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./deploy/
          server-dir: ${{ vars.CPANEL_SERVER_DIR }}
          state-name: cpanel-state.txt
