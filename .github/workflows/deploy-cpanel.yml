name: Deploy para cPanel (maricoachfit.com)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar pasta de deploy
        run: |
          command -v php >/dev/null && php -l nova-landing/index.php && php -l nova-landing/private/ofertas.php || echo "php ausente no runner, lint pulado"
          rm -rf deploy && mkdir -p deploy/imagens deploy/prova deploy/private/dados deploy/painel
          cp nova-landing/index.html nova-landing/index.php nova-landing/privacidade.html nova-landing/termos.html deploy/
          # indexnovo/indexdesign NÃO publicam: são variantes locais de experimento
          # (testes Playwright usam o preview local). Não subir = a Action apaga
          # as cópias antigas do servidor no próximo deploy incremental.
          cp nova-landing/.htaccess deploy/ 2>/dev/null || true
          cp nova-landing/private/ofertas.php nova-landing/private/rastreio.php deploy/private/
          cp nova-landing/private/.htaccess deploy/private/
          # painel da proprietária (o config.php já sobe com o hash da senha)
          cp nova-landing/painel/index.php nova-landing/painel/config.php deploy/painel/
          cp nova-landing/painel/.htaccess deploy/painel/
          # dados/ (log de visitas + links) só precisa existir com o .htaccess
          # que bloqueia o acesso — os arquivos são criados pelo painel em uso.
          cp nova-landing/private/dados/.htaccess deploy/private/dados/
          cp conteudo/imagens/*.png conteudo/imagens/*.jpeg conteudo/imagens/*.jpg conteudo/imagens/*.svg deploy/imagens/
          cp conteudo/prova/*.jpg deploy/prova/
          sed -i 's#\.\./conteudo/imagens/#imagens/#g; s#\.\./conteudo/prova/#prova/#g' deploy/*.html deploy/*.php deploy/painel/*.php
          grep -r "conteudo/" deploy/ && exit 1 || echo "links ok"
          # garantia: index.php publicado não contém checkout hardcoded (só via ofertas.php)
          ! grep -o 'pay\.kiwify\.com\.br/[A-Za-z0-9]*' deploy/index.php && echo "php sem checkout hardcoded ok"
          # painel nunca pode subir com senha em texto puro (só hash)
          grep -q "senha_hash" deploy/painel/config.php || { echo "ERRO: painel sem hash de senha"; exit 1; }
          grep -q "COLE_AQUI_O_HASH" deploy/painel/config.php && { echo "ERRO: painel ainda com hash placeholder"; exit 1; }

      # Sobe em NOVA/ enquanto o WordPress antigo continua na raiz. Quando a
      # proprietária aprovar, troque para CPANEL_SERVER_DIR: "" (raiz) e
      # arquive/remova o WordPress antes — senão os dois index.php disputam.
      - name: Enviar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./deploy/
          server-dir: ${{ vars.CPANEL_SERVER_DIR }}
          state-name: cpanel-state.txt
